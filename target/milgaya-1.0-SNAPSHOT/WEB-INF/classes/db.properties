# ===================================================
# Milgaya Database Configuration
# ===================================================
# Choose database type: 'h2' (default embedded, zero-setup) or 'mysql'
db.type=h2

# --- H2 Database Settings (default) ---
# Creates an embedded persistent database in the user's home folder /.milgaya/milgaya_db
db.h2.user=sa
db.h2.password=

# --- MySQL Database Settings ---
# To switch to MySQL:
# 1. Change db.type=mysql
# 2. Run the database/milgaya_schema.sql script in your MySQL server
# 3. Update your credentials below
db.mysql.url=jdbc:mysql://localhost:3306/milgaya_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
db.mysql.user=root
db.mysql.password=
